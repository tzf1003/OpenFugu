services:
  openfugu:
    build:
      context: .
      args:
        OPENFUGU_VERSION: "0.2"
    image: openfugu:0.2
    container_name: openfugu-0-2
    env_file:
      - .env
    environment:
      PORT: "8090"
      FUGU_CONFIG: configs/fugu.yaml
      FUGU_SERVE_URL: http://127.0.0.1:8090
      FUGU_MODEL: Qwen/Qwen3-0.6B
      FUGU_VECTOR: artifacts/router_head_zero_svf.npy
      FUGU_FLASH_HEAD: data/flash_head.npy
      FUGU_PRO_HEAD: data/pro_head.npy
      FUGU_DEBUG: "1"
      OPENAI_MODEL: "gpt-5.5,gpt-5.4,claude-opus-4-8,claude-sonnet-4-6,claude-haiku-4-5-20251001,gemini-3.5-flash,gemini-3.1-pro-preview,deepseek-v4-pro,deepseek-v4-flash,kimi-k2.7-code,kimi-k2.6"
      CONSOLE_PORT: "8091"
    ports:
      - "8090:8090"
      - "8091:8091"
    volumes:
      - huggingface-cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface-cache:
